<!DOCTYPE html>
<!-- Developer: Nguyễn Hải Đăng (DAG) | Zalo: 0866984097 | Cảm ơn bạn đã tôn trọng tác giả -->
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-field="page.title" data-label="Tiêu đề trang" data-type="text">Link Bio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a14;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== ANIMATED BACKGROUND ORBS ===== */
        .bg-effects {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-effects .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: orbFloat 10s ease-in-out infinite alternate;
        }

        .bg-effects .orb:nth-child(1) {
            width: 380px;
            height: 380px;
            background: #6c5ce7;
            top: -120px;
            left: -100px;
        }

        .bg-effects .orb:nth-child(2) {
            width: 320px;
            height: 320px;
            background: #fd79a8;
            bottom: -100px;
            right: -80px;
            animation-delay: -3.5s;
        }

        .bg-effects .orb:nth-child(3) {
            width: 260px;
            height: 260px;
            background: #00cec9;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -7s;
            opacity: 0.2;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.08); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
            100% { transform: translate(40px, -30px) scale(1.12); }
        }

        /* ===== PARTICLES ===== */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            animation: particleFloat linear infinite;
            animation-fill-mode: both;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            8% { opacity: 1; }
            92% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ===== MAIN CARD ===== */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 36px 24px 26px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(50px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== PROFILE ===== */
        .profile {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 14px;
        }

        .avatar-wrapper .ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(#6c5ce7, #fd79a8, #00cec9, #a29bfe, #6c5ce7);
            animation: spinRing 5s linear infinite;
            filter: drop-shadow(0 0 12px rgba(108, 92, 231, 0.3));
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar-wrapper .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #0a0a14;
            position: relative;
            z-index: 1;
            display: block;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.05);
        }

        .profile .name {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 3px;
            letter-spacing: -0.3px;
        }

        .profile .tagline {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .profile .bio {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 10px;
            line-height: 1.6;
            max-width: 280px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== DIVIDER ===== */
        .divider {
            width: 50px;
            height: 2px;
            margin: 0 auto 22px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            border-radius: 2px;
        }

        /* ===== LINKS ===== */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 18px;
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            opacity: 0;
            animation: linkFadeIn 0.5s ease forwards;
        }

        .link-btn.link-btn--hidden {
            display: none !important;
        }

        .link-btn:nth-child(1) { animation-delay: 0.15s; }
        .link-btn:nth-child(2) { animation-delay: 0.25s; }
        .link-btn:nth-child(3) { animation-delay: 0.35s; }
        .link-btn:nth-child(4) { animation-delay: 0.45s; }
        .link-btn:nth-child(5) { animation-delay: 0.55s; }
        .link-btn:nth-child(6) { animation-delay: 0.65s; }

        @keyframes linkFadeIn {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .link-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--btn-color1), var(--btn-color2));
            opacity: 0;
            transition: opacity 0.4s ease;
            border-radius: 14px;
        }

        .link-btn:hover::before {
            opacity: 1;
        }

        .link-btn .icon {
            position: relative;
            z-index: 1;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            background: rgba(255, 255, 255, 0.07);
            flex-shrink: 0;
        }

        .link-btn .label {
            position: relative;
            z-index: 1;
            flex: 1;
        }

        .link-btn .arrow {
            position: relative;
            z-index: 1;
            font-size: 12px;
            opacity: 0.35;
        }

        /* Link Colors */
        .link-btn.github { --btn-color1: #2d2d44; --btn-color2: #1a1a2e; }
        .link-btn.tiktok { --btn-color1: #ff004f; --btn-color2: #cc0040; }
        .link-btn.zalo { --btn-color1: #0068ff; --btn-color2: #0044cc; }
        .link-btn.instagram { --btn-color1: #f58529; --btn-color2: #c13584; }
        .link-btn.facebook { --btn-color1: #1877f2; --btn-color2: #0d65d9; }
        .link-btn.website { --btn-color1: #6c5ce7; --btn-color2: #4834d4; }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 26px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.3px;
        }

        /* ===== MUSIC BUTTON ===== */
        .music-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 10;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: scale(1.1);
        }

        .music-btn.playing {
            color: #6c5ce7;
            animation: musicPulse 2s ease infinite;
        }

        @keyframes musicPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(108, 92, 231, 0.2); }
            50% { box-shadow: 0 0 35px rgba(108, 92, 231, 0.4); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container { padding: 28px 18px 22px; border-radius: 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-effects">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="particles" id="particles"></div>

    <!-- Music Button -->
    <button class="music-btn" id="musicBtn" title="Phát nhạc">
        <i class="fa-solid fa-music"></i>
    </button>

    <div class="container">

        <!-- Profile -->
        <div class="profile">
            <div class="avatar-wrapper">
                <div class="ring"></div>
                <img class="avatar" 
                     src="https://i.ibb.co/Pzz5Bmh5/logo4.png" 
                     data-field="profile.avatar" 
                     data-label="Ảnh đại diện" 
                     data-type="image" 
                     alt="avatar" />
            </div>
            <h1 class="name" 
                data-field="profile.name" 
                data-label="Tên hiển thị" 
                data-type="text">Nguyen Van A</h1>
            <p class="tagline" 
               data-field="profile.tagline" 
               data-label="Tagline / Chức danh" 
               data-type="text">Creator &amp; Developer</p>
            <p class="bio" 
               data-field="profile.bio" 
               data-label="Mô tả ngắn (Bio)" 
               data-type="textarea">Chia sẻ kiến thức, thiết kế và công nghệ mới nhất.</p>
        </div>

        <div class="divider"></div>

        <!-- Links -->
        <div class="links">

            <a href="https://www.facebook.com/" 
               class="link-btn tiktok" target="_blank"
               data-field="links.0.url" data-label="Link TikTok" data-type="link">
                <span class="icon"><i class="fa-brands fa-tiktok"></i></span>
                <span class="label" data-field="links.0.label" data-label="Tên nút TikTok" data-type="text">TikTok</span>
                <span class="arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </a>

            <a href="https://www.facebook.com/" 
               class="link-btn zalo" target="_blank"
               data-field="links.1.url" data-label="Link Zalo" data-type="link">
                <span class="icon"><i class="fa-solid fa-comment-dots"></i></span>
                <span class="label" data-field="links.1.label" data-label="Tên nút Zalo" data-type="text">Zalo</span>
                <span class="arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </a>

            <a href="https://www.facebook.com/" 
               class="link-btn instagram" target="_blank"
               data-field="links.2.url" data-label="Link Instagram" data-type="link">
                <span class="icon"><i class="fa-brands fa-instagram"></i></span>
                <span class="label" data-field="links.2.label" data-label="Tên nút Instagram" data-type="text">Instagram</span>
                <span class="arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </a>

            <a href="https://www.facebook.com/" 
               class="link-btn facebook" target="_blank"
               data-field="links.3.url" data-label="Link Facebook" data-type="link">
                <span class="icon"><i class="fa-brands fa-facebook-f"></i></span>
                <span class="label" data-field="links.3.label" data-label="Tên nút Facebook" data-type="text">Facebook</span>
                <span class="arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </a>

            <a href="https://www.facebook.com/" 
               class="link-btn github" target="_blank"
               data-field="links.4.url" data-label="Link GitHub" data-type="link">
                <span class="icon"><i class="fa-brands fa-github"></i></span>
                <span class="label" data-field="links.4.label" data-label="Tên nút GitHub" data-type="text">GitHub</span>
                <span class="arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </a>

            <a href="https://www.facebook.com/" 
               class="link-btn website" target="_blank"
               data-field="links.5.url" data-label="Link Website" data-type="link">
                <span class="icon"><i class="fa-solid fa-globe"></i></span>
                <span class="label" data-field="links.5.label" data-label="Tên nút Website" data-type="text">Website</span>
                <span class="arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            © 2026 <strong>OriginD</strong>. All rights reserved.
        </div>
    </div>

    <script>
        // Hide empty links
        (function hideEmptyLinks() {
            document.querySelectorAll('.link-btn').forEach(function(btn) {
                var href = btn.getAttribute('href');
                if (!href || href === '#' || href.trim() === '') {
                    btn.classList.add('link-btn--hidden');
                }
            });
        })();

        // Particles
        (function createParticles() {
            const container = document.getElementById('particles');
            const count = window.innerWidth < 480 ? 25 : 45;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 3 + 1.5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                const delay = Math.random() * 12;
                const duration = Math.random() * 14 + 8;
                particle.style.animationDuration = duration + 's';
                particle.style.animationDelay = delay + 's';
                container.appendChild(particle);
            }
        })();

        // Music Player
        (function musicPlayer() {
            const btn = document.getElementById('musicBtn');
            const icon = btn.querySelector('i');
            const audio = new Audio('https://files.catbox.moe/4upafc.mp3');
            audio.loop = false;
            let isPlaying = false;

            audio.addEventListener('ended', function() {
                btn.classList.remove('playing');
                icon.className = 'fa-solid fa-music';
                isPlaying = false;
            });

            btn.addEventListener('click', function() {
                if (isPlaying) {
                    audio.pause();
                    audio.currentTime = 0;
                    btn.classList.remove('playing');
                    icon.className = 'fa-solid fa-music';
                    isPlaying = false;
                } else {
                    audio.play();
                    btn.classList.add('playing');
                    icon.className = 'fa-solid fa-circle-pause';
                    isPlaying = true;
                }
            });
        })();
    </script>
</body>
</html>
